# Alerts for the shared CI caches of a Woodpecker agent host, fed by the node_exporter textfile that
# woodpecker-ci-cache-prune.service writes (scripts/ci-cache/prune.sh --prom ...).
# Reference copy. The monitoring VM loads /etc/prometheus/rules/*.yml, and the fleet ships those files from
# proxmox_florin_server (config/prometheus/rules/, promtool tests in tests/promtool/), so the copy that is
# deployed lives there; keep the two in step. Nothing here loads by itself.
# The series carry the `host` label that the Prometheus file_sd target list gives each build host (the same
# label the fleet CI-host pressure rules group by), so alerts name the host, not an address.
# The metric names below are checked against what prune.sh writes by bin/test_ci_cache_scripts.py.
groups:
  - name: ci_cache_prune
    interval: 1m
    rules:
      - alert: CiCacheOverCap
        expr: max by (host, cache) (ci_cache_prune_over_cap) == 1
        for: 5m
        labels:
          severity: warning
          service: fleet_ci_cache_prune
        annotations:
          summary: "{{ $labels.cache }} cache on {{ $labels.host }} is still over its cap after the nightly prune"
          description: "prune.sh deleted everything it may (files of the last day, modules younger than its minimum age) and the cache is still above ci_cache_prune_cap_bytes. The disk cap is not holding, and the unit shows as failed. Read the run with: journalctl -u woodpecker-ci-cache-prune.service --since -2d. Either the cap is too small for a working day (raise it with a systemd drop-in, see docs/runbooks/woodpecker-ci-go-cache-pilot.md) or something writes to the cache outside the pipelines."
          runbook_url: docs/runbooks/woodpecker-ci-go-cache-pilot.md

      - alert: CiCachePruneStale
        expr: (time() - max by (host) (ci_cache_prune_last_run_timestamp_seconds)) > 129600
        for: 30m
        labels:
          severity: warning
          service: fleet_ci_cache_prune
        annotations:
          summary: "the CI cache prune on {{ $labels.host }} has not finished a run for over 36 hours"
          description: "The timer runs daily (about 03:15 UTC), so a gap over 36 hours means a run was missed or crashed before it wrote its textfile. Nothing bounds the cache disk until it runs again. Check: systemctl status woodpecker-ci-cache-prune.timer woodpecker-ci-cache-prune.service on that host."
          runbook_url: docs/runbooks/woodpecker-ci-go-cache-pilot.md
