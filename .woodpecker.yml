when:
  - event: [pull_request, push]

steps:
  secrets:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    commands:
      # Generated registry data and older bin scripts contain documented
      # credentials and fixtures. Gate this operational unit explicitly; the
      # imported data needs a separate baseline for its known false positives.
      - >-
        for path in bin/ci_authority_audit.py
        bin/ci_execution_report.py
        bin/woodpecker_load_controller.py
        bin/test_ci_authority_audit.py
        bin/test_ci_execution_report.py
        bin/test_woodpecker_load_controller.py
        ci-authorities.json
        ci-execution-report.json
        docs/runbooks/woodpecker-cross-host-capacity.md
        templates/woodpecker-agent-secret.env.example
        templates/woodpecker-cross-host-agent.compose.yml
        templates/woodpecker-load-controller.example.json
        templates/woodpecker-load-controller@.service
        templates/woodpecker-private-proxy@.service.tmpl
        templates/woodpecker-private-proxy@.socket.tmpl
        templates/woodpecker-private-route.service
        templates/woodpecker-private-route.sh.tmpl;
        do gitleaks detect --source "$path" --config .gitleaks.toml
        --redact --no-banner --no-git || exit 1; done

  tests:
    image: python:3.13-alpine
    commands:
      - python3 -m unittest discover -s bin -p 'test_*.py'
      - python3 -m py_compile bin/ci_authority_audit.py bin/ci_execution_report.py bin/woodpecker_load_controller.py
