when:
  - event: [pull_request, push]

steps:
  secrets:
    depends_on: []
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    commands:
      # Generated registry data and older bin scripts contain documented
      # credentials and fixtures. Gate this operational unit explicitly; the
      # imported data needs a separate baseline for its known false positives.
      - >-
        for path in bin/ci_authority_audit.py
        bin/ci_execution_report.py
        bin/woodpecker_load_controller.py
        bin/test_ci_authority_audit.py
        bin/test_ci_execution_report.py
        bin/test_woodpecker_load_controller.py
        ci-authorities.json
        ci-execution-report.json
        docs/runbooks/woodpecker-cross-host-capacity.md
        templates/woodpecker-agent-token.path.env.example
        templates/woodpecker-cross-host-agent.compose.yml
        templates/woodpecker-load-controller.example.json
        templates/woodpecker-load-controller@.service
        templates/woodpecker-private-proxy@.service.tmpl
        templates/woodpecker-private-proxy@.socket.tmpl
        templates/woodpecker-private-route.service
        templates/woodpecker-private-route.sh.tmpl;
        do gitleaks detect --source "$path" --config .gitleaks.toml
        --redact --no-banner --no-git || exit 1; done

  tests:
    depends_on: []
    image: python:3.13-alpine
    commands:
      - apk add --no-cache git bash
      - |
        target="$${CI_COMMIT_TARGET_BRANCH:-$${CI_REPO_DEFAULT_BRANCH}}"
        source="$${CI_COMMIT_SOURCE_BRANCH:-$${CI_COMMIT_BRANCH}}"
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --unshallow --no-tags origin "$$target" "$$source"
        else
          git fetch --no-tags origin "$$target" "$$source"
        fi
      - python3 -m unittest discover -s bin -p 'test_*.py'
      - python3 bin/check_service_version_regressions.py origin/main
      - python3 -m py_compile bin/ci_authority_audit.py bin/ci_execution_report.py bin/woodpecker_load_controller.py

  claude-md-format:
    depends_on: []
    image: node:22
    commands:
      # The 68 mesh-* repositories run `prettier --check .` (prettier ^3.7.4, printWidth 100, no .prettierignore) over the CLAUDE.md copy
      # the weekly rollout pushes, so a canonical that is not prettier-clean fails their next real CI run (found 2026-10-15 in
      # mesh-card-sorter#9). Fix a failure with: npx prettier@3.7.4 --config <same json> --write CLAUDE.md, then `docdrift gen --check`.
      - |
        printf '%s' '{"semi":true,"singleQuote":false,"trailingComma":"all","printWidth":100}' > /tmp/prettierrc.json
        npx --yes prettier@3.7.4 --config /tmp/prettierrc.json --check CLAUDE.md

  docs-drift:
    depends_on: []
    image: python:3.13-alpine
    commands:
      - apk add --no-cache git
      # No unshallow here: --ref HEAD only reads blobs at HEAD, and this step runs in parallel (depends_on: []) with
      # the tests step, which unshallows the same workspace ("shallow file has changed since we read it").
      # bin/docdrift.py addresses repositories as <repos>/<name>; only this repository exists in CI.
      - mkdir -p /tmp/repos && ln -s "$PWD" /tmp/repos/services-registry
      # A lone & used as a command separator in a shell recipe backgrounds the left command (commit 1cdfe74 turned 13 && into &).
      - python3 bin/docdrift.py --repos /tmp/repos --ref HEAD lint CLAUDE.md AGENTS.md
      # GENERATED blocks must match the data they are generated from (blocks whose repository is not checked out here are skipped).
      - python3 bin/docdrift.py --repos /tmp/repos --ref HEAD gen --check CLAUDE.md AGENTS.md
      # Anchors on symbols in this repository must still match their digest. Anchors on other repositories are skipped here
      # and checked by the nightly job on the builder (fleet-state scripts/docdrift-nightly.sh).
      - python3 bin/docdrift.py --repos /tmp/repos --ref HEAD check CLAUDE.md AGENTS.md
