when:
  - event: [pull_request, push]

steps:
  secrets:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    commands:
      # Generated registry data contains documented credentials and fixtures.
      # Gate executable operational code; the imported data needs a separate
      # baseline before it can be scanned without 70+ known false positives.
      - gitleaks detect --source bin --config .gitleaks.toml --redact --no-banner --no-git
      - gitleaks detect --source templates --config .gitleaks.toml --redact --no-banner --no-git

  tests:
    image: python:3.13-alpine
    commands:
      - python3 -m unittest discover -s bin -p 'test_*.py'
      - python3 -m py_compile bin/ci_authority_audit.py bin/woodpecker_load_controller.py
